name: Subset fonts to Latin WOFF2 (same font file, same metrics)
on:
  push:
    branches: [claude/lighthouse-sweep]
    paths: ['.github/lh/fonts.txt', '.github/workflows/font-subset.yml']
permissions:
  contents: read
jobs:
  subset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 1 }
      - run: pip install fonttools==4.60.1 brotli==1.1.0
      - name: Subset each listed font from the repo's default branch
        run: |
          mkdir -p out
          U="U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2193,U+2212,U+2215,U+FEFF,U+FFFD"
          grep -v '^#' .github/lh/fonts.txt | while read -r REPO P; do
            [ -z "$REPO" ] && continue
            curl -sfL "https://raw.githubusercontent.com/royeradames/$REPO/HEAD/$P" -o in.ttf
            N=$(basename "$P"); N=${N%.*}
            mkdir -p "out/$REPO"
            pyftsubset in.ttf --unicodes="$U" --layout-features='*' --flavor=woff2 --output-file="out/$REPO/$N-latin.woff2"
            echo "$REPO $N $(stat -c %s in.ttf) -> $(stat -c %s "out/$REPO/$N-latin.woff2")"
          done
      - uses: actions/upload-artifact@v4
        with: { name: fonts-latin-woff2, path: out/, retention-days: 7 }
